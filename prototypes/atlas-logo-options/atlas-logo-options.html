<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Atlas / SVG 标志候选</title><style>
:root{color-scheme:light;--bg:#f7f8f3;--surface:#fff;--ink:#252822;--muted:#626a5c;--line:#dbe0d2;--accent:#637c28;--selected:#edf1e3;--lime:#d4ef76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft YaHei","PingFang SC",sans-serif}body.dark{color-scheme:dark;--bg:#191e18;--surface:#232b20;--ink:#ecf0e3;--muted:#aeb7a4;--line:#424a3b;--accent:#d4ef76;--selected:#333f28}button{font:inherit;color:inherit;cursor:pointer}svg{display:block;width:100%;height:100%}header{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:16px}.brand-mark{width:32px;height:32px;color:var(--accent)}.brand-word{display:grid;line-height:1.5}.brand-word strong{font-size:16px}.brand-word small{font-size:12px;color:var(--muted)}nav{display:flex;gap:8px;margin:auto}nav span{font-size:14px;padding:10px 16px}nav .current{background:var(--lime);color:#252822;border-radius:8px;font-weight:700}.theme{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:44px;height:44px;padding:10px}main{max-width:1120px;margin:auto;padding:44px 28px 100px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;letter-spacing:2px}h1{font-size:32px;line-height:1.3;margin:0 0 12px}.intro{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}.option{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px;min-width:0;display:flex;flex-direction:column}.option[aria-pressed=true]{border-color:var(--accent);background:var(--selected)}.option:focus-visible,.theme:focus-visible,.switcher button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.option-head{display:grid;gap:24px}.option-head strong{font-size:16px}.large{width:64px;height:64px;color:var(--accent);margin:0 auto}.option p{font-size:14px;min-height:70px;color:var(--muted);margin:24px 0}.size-row{display:flex;gap:20px;align-items:end;justify-content:center;margin-top:auto}.size-row>span{display:grid;gap:10px;justify-items:center;font-size:12px;color:var(--muted)}i{display:block;color:var(--ink)}.icon16{width:16px;height:16px}.icon24{width:24px;height:24px}.icon32{width:32px;height:32px}.context{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.context section{padding:24px;border-top:1px solid var(--line)}h2{font-size:16px;margin:0 0 20px}.context-brand{display:flex;align-items:center;gap:12px}.context-mark{width:32px;height:32px;color:var(--accent)}.tab{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:14px}.tab-mark{width:16px;height:16px}.context p{font-size:14px;color:var(--muted);margin:20px 0 0}.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:var(--ink);color:var(--bg);padding:8px;border-radius:12px;box-shadow:0 8px 24px #0002}.switcher button{background:transparent;border:1px solid var(--muted);border-radius:8px;width:36px;height:36px}.switcher strong{font-size:14px;min-width:148px;text-align:center}@media(max-width:850px){nav{display:none}.theme{margin-left:auto}.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){main{padding:28px 20px 100px}.grid{gap:12px}.option{padding:16px}.option p{min-height:92px}.size-row{gap:14px}.context{grid-template-columns:1fr}h1{font-size:26px}}
</style></head><body><header><span class="brand-mark" data-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></span><span class="brand-word"><strong>DESIGN ATLAS</strong><small>从案例到实践</small></span><nav aria-label="顶栏效果示例"><span class="current">首页</span><span>浏览案例</span><span>设计实验室</span><span>Agent 工作流</span></nav><button class="theme" id="theme" aria-label="查看深色效果"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg></button></header><main><p class="eyebrow">SVG / DESIGN ATLAS</p><h1>四个简约标志，放进真实使用尺寸。</h1><p class="intro">点选候选查看顶栏与标签页效果，也可以切换深浅背景。标志均为原创 SVG，暂未替换网站。</p><div class="grid"><button class="option" data-option="A" aria-pressed="true"><span class="option-head"><strong>A / 折线 A</strong><span class="large"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></span></span><p>Atlas 的首字母。锐角轮廓与断开的横梁，最简洁。</p><span class="size-row"><span><i class="icon16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></i>16px</span><span><i class="icon24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></i>24px</span><span><i class="icon32"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></i>32px</span></span></button><button class="option" data-option="B" aria-pressed="false"><span class="option-head"><strong>B / 双轨交接</strong><span class="large"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19V6h13M13 26h13V13M10 22l12-12"/></svg></span></span><p>两段方向相同的轨道，表达从参考走向构建。</p><span class="size-row"><span><i class="icon16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19V6h13M13 26h13V13M10 22l12-12"/></svg></i>16px</span><span><i class="icon24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19V6h13M13 26h13V13M10 22l12-12"/></svg></i>24px</span><span><i class="icon32"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19V6h13M13 26h13V13M10 22l12-12"/></svg></i>32px</span></span></button><button class="option" data-option="C" aria-pressed="false"><span class="option-head"><strong>C / 聚焦坐标</strong><span class="large"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5H5v6M21 5h6v6M27 21v6h-6M11 27H5v-6"/><path d="m16 12 4 4-4 4-4-4z" fill="currentColor" stroke="none"/></svg></span></span><p>以四角锁定设计目标，中点代表正在探索的方向。</p><span class="size-row"><span><i class="icon16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5H5v6M21 5h6v6M27 21v6h-6M11 27H5v-6"/><path d="m16 12 4 4-4 4-4-4z" fill="currentColor" stroke="none"/></svg></i>16px</span><span><i class="icon24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5H5v6M21 5h6v6M27 21v6h-6M11 27H5v-6"/><path d="m16 12 4 4-4 4-4-4z" fill="currentColor" stroke="none"/></svg></i>24px</span><span><i class="icon32"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5H5v6M21 5h6v6M27 21v6h-6M11 27H5v-6"/><path d="m16 12 4 4-4 4-4-4z" fill="currentColor" stroke="none"/></svg></i>32px</span></span></button><button class="option" data-option="D" aria-pressed="false"><span class="option-head"><strong>D / 三点连接</strong><span class="large"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 22 7-12 7 12"/><circle cx="7.5" cy="24" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="24.5" cy="24" r="3"/></svg></span></span><p>案例、实验、Agent 连接成一条工作流。</p><span class="size-row"><span><i class="icon16"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 22 7-12 7 12"/><circle cx="7.5" cy="24" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="24.5" cy="24" r="3"/></svg></i>16px</span><span><i class="icon24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 22 7-12 7 12"/><circle cx="7.5" cy="24" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="24.5" cy="24" r="3"/></svg></i>24px</span><span><i class="icon32"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 22 7-12 7 12"/><circle cx="7.5" cy="24" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="24.5" cy="24" r="3"/></svg></i>32px</span></span></button></div><div class="context"><section><h2>顶栏 / 32px</h2><div class="context-brand"><span class="context-mark" data-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></span><strong>DESIGN ATLAS</strong></div><p id="choice-note">A / 折线 A：轮廓简洁，小尺寸也清楚。</p></section><section><h2>标签页 / 16px</h2><div class="tab"><span class="tab-mark" data-logo><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 25.5 16 6l10.5 19.5M11 19h10"/></svg></span><span>Design Atlas — 从案例到实践</span><span style="margin-left:auto">×</span></div><p>同一图形用于网站标志与 favicon，保持识别一致。</p></section></div></main><div class="switcher" aria-label="标志候选切换"><button id="prev" aria-label="上一个候选">←</button><strong id="choice">A / 折线 A</strong><button id="next" aria-label="下一个候选">→</button></div><script>
const options=[{"id":"A","name":"折线 A","note":"Atlas 的首字母。锐角轮廓与断开的横梁，最简洁。","shape":"<path d=\"M5.5 25.5 16 6l10.5 19.5M11 19h10\"/>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5.5 25.5 16 6l10.5 19.5M11 19h10\"/></svg>"},{"id":"B","name":"双轨交接","note":"两段方向相同的轨道，表达从参考走向构建。","shape":"<path d=\"M6 19V6h13M13 26h13V13M10 22l12-12\"/>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 19V6h13M13 26h13V13M10 22l12-12\"/></svg>"},{"id":"C","name":"聚焦坐标","note":"以四角锁定设计目标，中点代表正在探索的方向。","shape":"<path d=\"M11 5H5v6M21 5h6v6M27 21v6h-6M11 27H5v-6\"/><path d=\"m16 12 4 4-4 4-4-4z\" fill=\"currentColor\" stroke=\"none\"/>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5H5v6M21 5h6v6M27 21v6h-6M11 27H5v-6\"/><path d=\"m16 12 4 4-4 4-4-4z\" fill=\"currentColor\" stroke=\"none\"/></svg>"},{"id":"D","name":"三点连接","note":"案例、实验、Agent 连接成一条工作流。","shape":"<path d=\"m9 22 7-12 7 12\"/><circle cx=\"7.5\" cy=\"24\" r=\"3\"/><circle cx=\"16\" cy=\"7\" r=\"3\"/><circle cx=\"24.5\" cy=\"24\" r=\"3\"/>","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 22 7-12 7 12\"/><circle cx=\"7.5\" cy=\"24\" r=\"3\"/><circle cx=\"16\" cy=\"7\" r=\"3\"/><circle cx=\"24.5\" cy=\"24\" r=\"3\"/></svg>"}];let selected=new URLSearchParams(location.search).get('variant')||'A';function show(id){const found=options.find(o=>o.id===id)||options[0];selected=found.id;document.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=found.svg);document.querySelectorAll('[data-option]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.option===selected));document.querySelector('#choice').textContent=found.id+' / '+found.name;document.querySelector('#choice-note').textContent=found.id+' / '+found.name+'：'+found.note;history.replaceState(null,'','?variant='+selected)}function shift(delta){show(options[(options.findIndex(o=>o.id===selected)+delta+options.length)%options.length].id)}document.querySelectorAll('[data-option]').forEach(e=>e.addEventListener('click',()=>show(e.dataset.option)));document.querySelector('#prev').onclick=()=>shift(-1);document.querySelector('#next').onclick=()=>shift(1);document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');document.querySelector('#theme').setAttribute('aria-label',dark?'查看浅色效果':'查看深色效果')};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')shift(-1);if(e.key==='ArrowRight')shift(1)});show(selected);
</script></body></html>
