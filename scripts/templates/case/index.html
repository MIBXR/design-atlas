<!doctype html>
<html lang="zh-CN">
<head>

  <main>
    <header><p>案例示例</p><h1>用清楚的层级呈现内容</h1><p>替换标题、正文和视觉，组合自己的页面。</p><a href="#details">阅读详情</a></header>
    <section id="details"><h2>详情</h2><p>页面随视口重排，观看者通过滚动和链接阅读。</p></section>
  </main>
